<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ずけい きおく ゲーム</title>
  <meta name="description" content="3×3または4×4のマスに置かれた図形を覚えて再現する子ども向け記憶ゲーム" />
  <meta name="theme-color" content="#fffaf0" />
  <style>
    :root{--ink:#20242a;--blue:#6ec5f3;--blue-dark:#2097d3;--red:#f22;--soft:#fffaf0;--line:#252525;--shadow:0 10px 28px rgba(60,45,25,.14)}
    *{box-sizing:border-box} html,body{min-height:100%}
    body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 12%,rgba(255,221,133,.28),transparent 24%),radial-gradient(circle at 88% 85%,rgba(110,197,243,.20),transparent 27%),var(--soft);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow-x:hidden}
    button{font:inherit}
    .app{width:min(1220px,100%);min-height:100vh;margin:0 auto;padding:18px clamp(14px,3vw,36px) 28px;display:grid;grid-template-columns:minmax(420px,1.18fr) minmax(330px,.82fr);gap:clamp(24px,4vw,56px);align-items:center}
    .board-wrap{display:flex;justify-content:center;align-items:center}
    .board{width:min(72vh,620px,100%);aspect-ratio:1;display:grid;background:rgba(255,255,255,.82);border:3px solid var(--line);box-shadow:var(--shadow)}
    .cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;background:rgba(255,255,255,.78);border-right:2px solid var(--line);border-bottom:2px solid var(--line);touch-action:none}
    .board.grid-3{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
    .board.grid-3 .cell:nth-child(3n){border-right:0}.board.grid-3 .cell:nth-child(n+7){border-bottom:0}
    .board.grid-4{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
    .board.grid-4 .cell:nth-child(4n){border-right:0}.board.grid-4 .cell:nth-child(n+13){border-bottom:0}
    .cell.answer-mode{cursor:pointer}.cell.answer-mode:hover,.cell.answer-mode:focus-visible{background:#eef9ff;outline:none}
    .shape{display:flex;align-items:center;justify-content:center;width:72%;height:72%;font-family:Arial,"Noto Sans Symbols 2",sans-serif;font-size:clamp(46px,7vw,96px);line-height:1;font-weight:500;color:#111;pointer-events:none}
    .grid-4 .shape{font-size:clamp(36px,5.4vw,72px)}
    .cell .shape{position:absolute;inset:14%;width:72%;height:72%}
    .shape[data-shape^="arrow-"]{font-weight:700}.grid-3 .shape[data-shape^="arrow-"]{font-size:clamp(54px,8vw,108px)}.grid-4 .shape[data-shape^="arrow-"]{font-size:clamp(42px,6vw,82px)}
    .correct-overlay{z-index:3;color:var(--red)!important;text-shadow:0 0 2px #fff,0 0 5px #fff;animation:markIn .28s ease-out both}.wrong-empty{z-index:3;color:var(--red)!important;font-weight:700!important}.cell.wrong-cell{background:#fff0f0}.cell.correct-cell{background:#eefff1}
    .side{min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
    .level{margin:0 0 10px;font-size:clamp(30px,4vw,46px);font-weight:900;letter-spacing:.04em}.message{min-height:1.35em;margin:6px 0 16px;font-size:clamp(28px,4.4vw,58px);font-weight:900;line-height:1.2}.message.small{font-size:clamp(22px,3vw,36px)}
    .timer{display:flex;justify-content:center;align-items:baseline;gap:7px;min-height:118px;margin:0 0 2px}.timer .remaining,.timer .seconds{font-size:clamp(20px,2.5vw,32px)}.timer .time{min-width:1.8em;font-family:Arial,sans-serif;font-size:clamp(82px,10vw,126px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums}.timer.danger .time{color:#e3342f;animation:pulse .7s infinite alternate}
    .memory-action{margin:0 0 14px}.palette{width:min(410px,100%);margin:0 auto 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .shape-btn{aspect-ratio:1;border:2px solid #222;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:.12s}.shape-btn:hover{transform:translateY(-2px);background:#f7fcff}.shape-btn.selected{background:#dff4ff;border-color:var(--blue-dark);outline:4px solid rgba(32,151,211,.22)}.shape-btn .shape{font-size:clamp(40px,5vw,62px);width:86%;height:86%}
    .actions{display:flex;gap:18px;justify-content:center;width:100%;margin:8px 0 12px}.action{min-width:168px;padding:11px 24px;border:2px solid #222;border-radius:12px;background:#fff;color:#111;font-size:clamp(22px,2.5vw,31px);font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}.action.primary{background:linear-gradient(#9bd7f7,#62bced);border-color:#168fc9}.action:hover{filter:brightness(.98);transform:translateY(-1px)}.action:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
    .character{position:relative;width:min(490px,92%);height:250px;display:flex;align-items:flex-end;justify-content:center;margin-top:2px}.character img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12))}.image-help{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;border:2px dashed #aaa;border-radius:20px;background:rgba(255,255,255,.7);color:#666;font-weight:700}
    .hidden{display:none!important}.drag-ghost{position:fixed;z-index:9999;width:82px;height:82px;display:flex;align-items:center;justify-content:center;border:2px solid var(--blue-dark);border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 10px 25px rgba(0,0,0,.2);pointer-events:none;transform:translate(-50%,-50%)}.drag-ghost .shape{font-size:57px}
    .confetti{position:fixed;z-index:9998;top:-24px;width:12px;height:20px;border-radius:3px;pointer-events:none;animation:confettiFall var(--duration) cubic-bezier(.16,.66,.34,1) forwards}.evolve{animation:evolve .9s ease both}
    @keyframes pulse{to{transform:scale(1.06)}}@keyframes markIn{from{transform:scale(.35) rotate(-10deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes evolve{0%{transform:scale(.7);filter:brightness(2) drop-shadow(0 0 0 gold);opacity:.2}45%{transform:scale(1.09);filter:brightness(1.35) drop-shadow(0 0 28px gold);opacity:1}100%{transform:scale(1);filter:drop-shadow(0 8px 10px rgba(0,0,0,.12))}}@keyframes confettiFall{to{transform:translate3d(var(--drift),108vh,0) rotate(var(--spin));opacity:.9}}
    @media(max-width:820px){.app{grid-template-columns:1fr;gap:18px;align-items:start}.board{width:min(92vw,560px)}.side{min-height:0}.character{height:220px}}@media(max-width:480px){.app{padding:10px 10px 24px}.palette{gap:7px}.shape-btn{border-radius:10px}.actions{gap:10px}.action{min-width:0;flex:1;padding:10px 8px}.character{height:180px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="board-wrap"><div id="board" class="board grid-3" aria-label="記憶マス"></div></section>
    <section class="side" aria-live="polite">
      <h1 id="levelText" class="level">レベル1</h1>
      <div id="message" class="message small">ずけいを おぼえよう</div>
      <div id="timer" class="timer"><span class="remaining">のこり</span><strong id="timeValue" class="time">20</strong><span class="seconds">びょう</span></div>
      <div id="memoryAction" class="memory-action"><button id="okButton" class="action primary" type="button">OK</button></div>
      <div id="answerControls" class="hidden"><div id="palette" class="palette" aria-label="図形を選ぶ"></div><div class="actions"><button id="resetButton" class="action" type="button">やりなおし</button><button id="doneButton" class="action primary" type="button">できた</button></div></div>
      <div id="resultControls" class="actions hidden"><button id="endButton" class="action" type="button">おわり</button><button id="nextButton" class="action primary" type="button">つぎへ</button><button id="retryButton" class="action primary hidden" type="button">もういちど</button></div>
      <div class="character"><img id="levelImage" src="lv1.png" alt="成長イラスト" /><div id="imageHelp" class="image-help">同じフォルダーに lv1.png ～ lv5.png を置いてください</div></div>
    </section>
  </main>
<script>
'use strict';
const MEMORY_SECONDS=20,MAX_LEVEL=10;
const LEVELS=[
 {size:3,count:3},{size:3,count:4},{size:3,count:5},
 {size:4,count:5},{size:4,count:6},{size:4,count:7},{size:4,count:8},
 {size:4,count:10},{size:4,count:12},{size:4,count:16}
];
const SHAPES=[{id:'circle',symbol:'○',label:'まる'},{id:'triangle',symbol:'△',label:'さんかく'},{id:'square',symbol:'□',label:'しかく'},{id:'cross',symbol:'×',label:'ばつ'},{id:'arrow-up',symbol:'↑',label:'うえ'},{id:'arrow-right',symbol:'→',label:'みぎ'},{id:'arrow-down',symbol:'↓',label:'した'},{id:'arrow-left',symbol:'←',label:'ひだり'}];
const $=id=>document.getElementById(id),board=$('board'),palette=$('palette'),levelText=$('levelText'),message=$('message'),timer=$('timer'),timeValue=$('timeValue'),memoryAction=$('memoryAction'),okButton=$('okButton'),answerControls=$('answerControls'),resultControls=$('resultControls'),resetButton=$('resetButton'),doneButton=$('doneButton'),endButton=$('endButton'),nextButton=$('nextButton'),retryButton=$('retryButton'),levelImage=$('levelImage'),imageHelp=$('imageHelp');
let level=1,phase='memory',answer=[],input=[],selectedShape=null,timerId=null,remaining=MEMORY_SECONDS,ghost=null,draggingShape=null;
const spec=()=>LEVELS[level-1]; const shapeById=id=>SHAPES.find(s=>s.id===id);
function makeShape(id,extra=''){const d=shapeById(id),e=document.createElement('span');e.className=`shape ${extra}`.trim();e.dataset.shape=id;e.textContent=d.symbol;e.setAttribute('aria-label',d.label);return e}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
function createProblem(){const cells=spec().size**2;answer=Array(cells).fill(null);input=Array(cells).fill(null);const places=shuffle([...Array(cells).keys()]);let ids=[];if(level<8){ids=shuffle(SHAPES).slice(0,spec().count).map(s=>s.id)}else{const first=shuffle(SHAPES).map(s=>s.id);ids=first.slice(0,Math.min(8,spec().count));while(ids.length<spec().count)ids.push(SHAPES[Math.floor(Math.random()*SHAPES.length)].id);ids=shuffle(ids)}ids.forEach((id,i)=>answer[places[i]]=id)}
function buildBoard(){const cells=spec().size**2;board.innerHTML='';board.className=`board grid-${spec().size}`;board.setAttribute('aria-label',`${spec().size}かける${spec().size}の記憶マス`);for(let i=0;i<cells;i++){const c=document.createElement('div');c.className='cell';c.dataset.index=i;c.tabIndex=0;c.addEventListener('click',()=>handleCellClick(i));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handleCellClick(i)}});c.addEventListener('dragover',e=>e.preventDefault());c.addEventListener('drop',e=>{e.preventDefault();placeShape(i,e.dataTransfer.getData('text/plain'))});board.appendChild(c)}}
function buildPalette(){palette.innerHTML='';SHAPES.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='shape-btn';b.dataset.shape=s.id;b.draggable=true;b.setAttribute('aria-label',`${s.label}を選ぶ`);b.appendChild(makeShape(s.id));b.addEventListener('click',()=>selectShape(s.id));b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',s.id);e.dataTransfer.effectAllowed='copy'});b.addEventListener('pointerdown',e=>beginTouchDrag(e,s.id));palette.appendChild(b)})}
function render(values,answerMode=false){[...board.children].forEach((c,i)=>{c.className=`cell${answerMode?' answer-mode':''}`;c.innerHTML='';if(values[i])c.appendChild(makeShape(values[i]))})}
function updateImage(displayLevel=level,animate=false){const n=Math.min(5,Math.max(1,displayLevel));imageHelp.style.display='none';levelImage.style.display='block';levelImage.src=`lv${n}.png`;levelImage.alt=`レベル${n}の成長イラスト`;levelImage.classList.remove('evolve');if(animate){void levelImage.offsetWidth;levelImage.classList.add('evolve')}}
levelImage.addEventListener('error',()=>{levelImage.style.display='none';imageHelp.style.display='flex'});
function startLevel(same=false){clearInterval(timerId);phase='memory';selectedShape=null;remaining=MEMORY_SECONDS;levelText.textContent=`レベル${level}`;message.textContent='ずけいを おぼえよう';message.className='message small';timer.classList.remove('hidden','danger');memoryAction.classList.remove('hidden');timeValue.textContent=remaining;answerControls.classList.add('hidden');resultControls.classList.add('hidden');retryButton.classList.add('hidden');nextButton.classList.remove('hidden');nextButton.textContent=level===MAX_LEVEL?'さいしょへ':'つぎへ';if(!same)createProblem();else input=Array(spec().size**2).fill(null);buildBoard();render(answer);updateImage(level,false);timerId=setInterval(()=>{remaining--;timeValue.textContent=remaining;if(remaining<=5)timer.classList.add('danger');if(remaining<=0)beginAnswer()},1000)}
function beginAnswer(){if(phase!=='memory')return;clearInterval(timerId);phase='answer';selectedShape=null;timer.classList.add('hidden');memoryAction.classList.add('hidden');message.textContent='おぼえた ばしょに おこう';message.className='message small';answerControls.classList.remove('hidden');resultControls.classList.add('hidden');updateSelection();render(input,true)}
function selectShape(id){if(phase!=='answer')return;selectedShape=selectedShape===id?null:id;updateSelection()}function updateSelection(){document.querySelectorAll('.shape-btn').forEach(b=>b.classList.toggle('selected',b.dataset.shape===selectedShape))}
function handleCellClick(i){if(phase!=='answer')return;if(selectedShape)placeShape(i,selectedShape);else if(input[i]){input[i]=null;render(input,true)}}function placeShape(i,id){if(phase!=='answer'||!shapeById(id))return;input[i]=id;render(input,true)}
function resetInput(){if(phase!=='answer')return;input=Array(spec().size**2).fill(null);selectedShape=null;updateSelection();render(input,true);playTone(330,.07,'sine',.05)}
function grade(){if(phase!=='answer')return;phase='result';const good=answer.every((v,i)=>v===input[i]);answerControls.classList.add('hidden');resultControls.classList.remove('hidden');good?showCorrect():showIncorrect()}
function showCorrect(){message.textContent=level===MAX_LEVEL?'ぜんぶ せいかい！':'せいかい！';message.className='message';retryButton.classList.add('hidden');nextButton.classList.remove('hidden');[...board.children].forEach(c=>c.classList.add('correct-cell'));updateImage(Math.min(level+1,5),true);celebrate();playSuccess()}
function showIncorrect(){message.textContent='ざんねん！';message.className='message';nextButton.classList.add('hidden');retryButton.classList.remove('hidden');[...board.children].forEach((c,i)=>{c.className='cell';c.innerHTML='';if(input[i])c.appendChild(makeShape(input[i]));if(input[i]!==answer[i]){c.classList.add('wrong-cell');if(answer[i])c.appendChild(makeShape(answer[i],'correct-overlay'));else{const x=document.createElement('span');x.className='shape correct-overlay wrong-empty';x.textContent='／';c.appendChild(x)}}});playWrong()}
function nextLevel(){level=level<MAX_LEVEL?level+1:1;startLevel(false)}function retryLevel(){startLevel(true)}function endGame(){window.location.href='../index.html'}
function beginTouchDrag(e,id){if(phase!=='answer'||e.pointerType==='mouse')return;e.preventDefault();draggingShape=id;ghost=document.createElement('div');ghost.className='drag-ghost';ghost.appendChild(makeShape(id));document.body.appendChild(ghost);moveGhost(e.clientX,e.clientY);e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.addEventListener('pointermove',touchMove);e.currentTarget.addEventListener('pointerup',touchEnd,{once:true});e.currentTarget.addEventListener('pointercancel',touchEnd,{once:true})}function touchMove(e){e.preventDefault();moveGhost(e.clientX,e.clientY)}function moveGhost(x,y){if(ghost){ghost.style.left=`${x}px`;ghost.style.top=`${y}px`}}function touchEnd(e){e.currentTarget.removeEventListener('pointermove',touchMove);if(ghost)ghost.remove();ghost=null;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(t&&board.contains(t))placeShape(+t.dataset.index,draggingShape);draggingShape=null}
function audio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!window._zgAudio)window._zgAudio=new A();if(window._zgAudio.state==='suspended')window._zgAudio.resume();return window._zgAudio}function playTone(f,d,type='sine',vol=.08,delay=0){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.03)}function playSuccess(){[523,659,784,1047].forEach((f,i)=>playTone(f,.28,'triangle',.075,i*.12))}function playWrong(){playTone(220,.18,'sawtooth',.04);playTone(175,.28,'sawtooth',.035,.16)}
function celebrate(){const colors=['#ff5577','#ffd84d','#61c9ff','#73dc85','#b786ff','#ff9d3d'];for(let i=0;i<80;i++){const p=document.createElement('i');p.className='confetti';p.style.left=`${Math.random()*100}vw`;p.style.background=colors[i%colors.length];p.style.setProperty('--duration',`${2.2+Math.random()*1.8}s`);p.style.setProperty('--drift',`${-100+Math.random()*200}px`);p.style.setProperty('--spin',`${360+Math.random()*900}deg`);p.style.animationDelay=`${Math.random()*.45}s`;document.body.appendChild(p);setTimeout(()=>p.remove(),4600)}}
okButton.addEventListener('click',beginAnswer);resetButton.addEventListener('click',resetInput);doneButton.addEventListener('click',grade);nextButton.addEventListener('click',nextLevel);retryButton.addEventListener('click',retryLevel);endButton.addEventListener('click',endGame);buildPalette();startLevel(false);
</script>
</body>
</html>
