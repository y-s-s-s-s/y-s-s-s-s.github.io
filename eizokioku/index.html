<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>えいぞうきおくゲーム</title><style>
:root{--t:#f2f5ff;--m:#ffffffb8;--ok:#7cffb2;--ng:#ff7a7a;--a:#ffd54a}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:18px 0 26px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--t);background:radial-gradient(1000px 700px at 15% 10%,#253d85,#08122c),radial-gradient(900px 650px at 85% 20%,#3c1d7a,transparent 60%),linear-gradient(#08122c,#0b2a3a);display:flex;justify-content:center}.wrap{width:min(980px,94vw)}.head,.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head{margin-bottom:10px}h1{margin:0;font-size:21px}.sub{font-size:12px;color:var(--m);font-weight:800;margin-top:4px}.btn,.back{border:1px solid #ffffff29;color:var(--t);background:#ffffff1a;border-radius:14px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none}.card{padding:16px;border:1px solid #ffffff29;border-radius:20px;background:linear-gradient(#ffffff1c,#ffffff0f);box-shadow:0 18px 60px #0007}.pills,.results{display:flex;gap:8px;align-items:center}.pill{font-size:12px;font-weight:900;padding:7px 10px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff24}.pill b{color:var(--a)}.cell{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:26px;font-weight:1000;background:#0003;border:1px solid #ffffff24}.cell.ok{color:var(--ok);border-color:#7cffb273}.cell.ng{color:var(--ng);border-color:#ff7a7a73}.stage{margin-top:14px;min-height:370px;padding:18px;border-radius:18px;border:1px solid #ffffff24;background:#0003;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.phase{min-height:34px;color:var(--m);font-weight:900}.memory{font-size:clamp(108px,21vw,205px);line-height:1;filter:drop-shadow(0 18px 22px #0005)}.counter{margin-top:18px;color:var(--m);font-weight:900}.question{font-size:clamp(23px,4vw,34px);line-height:1.5;font-weight:1000;margin:4px 0 20px}.choices{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice{min-height:112px;border-radius:18px;border:1px solid #ffffff29;background:#ffffff1a;color:var(--t);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;font-weight:1000}.choice.correct{background:#7cffb22e;border-color:#7cffb28c}.choice.wrong{background:#ff7a7a2b;border-color:#ff7a7a8c}.emoji{font-size:50px}.status{margin-top:14px;min-width:min(420px,100%);padding:11px 14px;border-radius:14px;background:#0003;border:1px solid #ffffff1f;font-weight:900}.status.ok{border-color:#7cffb266}.status.ng{border-color:#ff7a7a66}.start{font-size:18px;padding:14px 24px;background:#ffd54a33;border-color:#ffd54a80}.settings{margin-top:14px;padding:13px;border-radius:18px;background:#ffffff0f;border:1px solid #ffffff24}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.setting{padding:12px;border-radius:14px;background:#00000024}.settingHead{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:900;margin-bottom:8px}.setting strong{color:var(--a)}input[type=range],select{width:100%}select{padding:8px;border-radius:10px;background:#152343;color:white;border:1px solid #ffffff29;font-weight:900}.tip{text-align:center;color:var(--m);font-size:12px;margin-top:10px}.hidden{display:none!important}@media(max-width:680px){.choices{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.stage{min-height:420px}h1{font-size:18px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>👀 えいぞうきおくゲーム</h1><div class="sub">じゅんばんを おぼえて、3もんに こたえよう</div></div><a class="back" href="../">← もどる</a></div><main class="card"><div class="top"><div class="pills"><div class="pill">ジャンル：<b id="genreNow">どうぶつ</b></div><div class="pill">もんだい：<b id="qno">0 / 3</b></div></div><div class="results"><span>けっか</span><div class="cell" id="r0">1</div><div class="cell" id="r1">2</div><div class="cell" id="r2">3</div></div></div><section class="stage"><div class="phase" id="phase">じゅんびが できたら はじめよう</div><div id="memoryArea" class="hidden"><div class="memory" id="memory"></div><div class="counter" id="counter"></div></div><div id="questionArea" class="hidden"><div class="question" id="question"></div><div class="choices" id="choices"></div></div><button class="btn start" id="start">スタート</button><div class="status" id="status">えを よくみて じゅんばんを おぼえてね</div></section><section class="settings"><b>⚙️ むずかしさ</b><div class="grid"><div class="setting"><div class="settingHead"><span>ひょうじじかん</span><strong id="durationValue">2.0びょう</strong></div><input id="duration" type="range" min="0.1" max="5" step="0.1" value="2.0"></div><div class="setting"><div class="settingHead"><span>えの かず</span><strong id="countValue">5こ</strong></div><input id="count" type="range" min="3" max="10" step="1" value="5"></div><div class="setting"><div class="settingHead"><span>ジャンル</span><strong id="genreValue">どうぶつ</strong></div><select id="genre"><option value="animals">どうぶつ</option><option value="vegetables">やさい</option><option value="shapes">いろとかたち</option><option value="mix">ミックス</option></select></div></div></section><div class="tip">せっていは、つぎのゲームから はんえいされます。</div></main></div><script>
const G={animals:{label:'どうぶつ',items:[['ごりら','🦍'],['うさぎ','🐰'],['ぞう','🐘'],['ねこ','🐱'],['うし','🐮'],['いぬ','🐶'],['さる','🐵'],['ぶた','🐷'],['きつね','🦊'],['らいおん','🦁'],['ぱんだ','🐼'],['こあら','🐨'],['とら','🐯'],['かえる','🐸']]},vegetables:{label:'やさい',items:[['とまと','🍅'],['なす','🍆'],['にんじん','🥕'],['とうもろこし','🌽'],['じゃがいも','🥔'],['さつまいも','🍠'],['きゅうり','🥒'],['ぴーまん','🫑'],['ぶろっこりー','🥦'],['たまねぎ','🧅'],['にんにく','🧄'],['きのこ','🍄']]},shapes:{label:'いろとかたち',items:[['あかい まる','🔴'],['あおい まる','🔵'],['きいろい まる','🟡'],['あかい しかく','🟥'],['あおい しかく','🟦'],['きいろい しかく','🟨'],['あかい はーと','❤️'],['あおい はーと','💙'],['きいろい はーと','💛'],['あかい さんかく','🔺'],['あおい ひしがた','🔷'],['きいろい ひしがた','🔶']]}};
const $=s=>document.querySelector(s),E={now:$('#genreNow'),qno:$('#qno'),phase:$('#phase'),ma:$('#memoryArea'),mem:$('#memory'),counter:$('#counter'),qa:$('#questionArea'),q:$('#question'),choices:$('#choices'),start:$('#start'),status:$('#status'),duration:$('#duration'),dv:$('#durationValue'),count:$('#count'),cv:$('#countValue'),genre:$('#genre'),gv:$('#genreValue')};let seq=[],pool=[],qs=[],qi=0,running=false,locked=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function status(t,k=''){E.status.textContent=t;E.status.className='status'+(k?' '+k:'')}function settings(){E.dv.textContent=Number(E.duration.value).toFixed(1)+'びょう';E.cv.textContent=E.count.value+'こ';E.gv.textContent=E.genre.options[E.genre.selectedIndex].text}E.duration.oninput=E.count.oninput=E.genre.onchange=settings;settings();function reset(){for(let i=0;i<3;i++){let c=$('#r'+i);c.textContent=i+1;c.className='cell'}}function questions(){let n=seq.length,b={type:'before',target:1+Math.floor(Math.random()*(n-1))},x={type:'next',target:Math.floor(Math.random()*(n-1))};b.answer=b.target-1;x.answer=x.target+1;return shuffle([b,x,{type:'first',answer:0}])}function options(ai){let ans=seq[ai],d=shuffle(seq.filter((_,i)=>i!==ai)).slice(0,3);if(d.length<3)d=d.concat(shuffle(pool.filter(x=>x[0]!==ans[0]&&!d.some(y=>y[0]===x[0]))).slice(0,3-d.length));return shuffle([ans,...d])}async function start(){if(running)return;running=locked=true;qi=0;reset();E.qno.textContent='0 / 3';E.start.classList.add('hidden');E.qa.classList.add('hidden');E.ma.classList.remove('hidden');let key=E.genre.value;if(key==='mix'){pool=Object.values(G).flatMap(g=>g.items);E.now.textContent='ミックス'}else{pool=G[key].items;E.now.textContent=G[key].label}seq=shuffle(pool).slice(0,+E.count.value);qs=questions();status('じゅんばんを おぼえてね');for(let i=0;i<seq.length;i++){E.phase.textContent='よくみて おぼえよう';E.mem.textContent=seq[i][1];E.counter.textContent=`${i+1} / ${seq.length}`;await sleep(+E.duration.value*1000);E.mem.textContent='';await sleep(Math.min(120,+E.duration.value*150))}E.ma.classList.add('hidden');E.qa.classList.remove('hidden');locked=false;show()}function show(){let q=qs[qi];E.qno.textContent=`${qi+1} / 3`;E.phase.textContent=`もんだい ${qi+1}`;if(q.type==='before')E.q.innerHTML=`${seq[q.target][0]} <span style="font-size:1.3em">${seq[q.target][1]}</span> の まえは なに？`;else if(q.type==='next')E.q.innerHTML=`${seq[q.target][0]} <span style="font-size:1.3em">${seq[q.target][1]}</span> の つぎは なに？`;else E.q.textContent='さいしょは なに？';E.choices.innerHTML='';options(q.answer).forEach(item=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="emoji">${item[1]}</span><span>${item[0]}</span>`;b.onclick=()=>answer(item,b);E.choices.appendChild(b)});status('4つから えらんでね')}async function answer(item,b){if(locked)return;locked=true;let q=qs[qi],ok=item[0]===seq[q.answer][0];[...E.choices.children].forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');if(!ok)[...E.choices.children].find(x=>x.lastChild.textContent===seq[q.answer][0])?.classList.add('correct');let c=$('#r'+qi);c.textContent=ok?'○':'×';c.classList.add(ok?'ok':'ng');status(ok?'せいかい！ 🎉':'ざんねん。こたえを かくにんしよう',ok?'ok':'ng');await sleep(950);if(++qi<3){locked=false;show()}else finish()}function finish(){E.qa.classList.add('hidden');E.start.classList.remove('hidden');E.start.textContent='つぎの ゲーム';E.phase.textContent='3もん おわり！';let n=[0,1,2].filter(i=>$('#r'+i).classList.contains('ok')).length;status(n===3?'ぜんもん せいかい！すごい！ 🏆':`${n}もん せいかい！`,n===3?'ok':'');running=locked=false}E.start.onclick=start;
</script></body></html>
